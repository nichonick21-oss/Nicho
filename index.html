<!DOCTYPE html>
<html>
<head>
<title>Kalkulator Bucat</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    padding:30px;
}

.container{
    width:420px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px #aaa;
}

h2{
    text-align:center;
}

input[type=number]{
    width:95%;
    padding:10px;
    margin-bottom:15px;
}


.list{
    padding:10px;
}


.item{
    margin:8px 0;
    padding:8px;
    border-radius:5px;
}


button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#1976d2;
    color:white;
    border:0;
    cursor:pointer;
}


.hasil{
    margin-top:20px;
    padding:15px;
    background:#eee;
    border-radius:5px;
}

</style>

</head>


<body>

<div class="container">

<h2>Kalkulator Bucat</h2>


<label>Nilai Awal</label>

<input type="number" id="nilai" placeholder="Masukkan nilai">


<div class="list">


<div class="item">
<input type="checkbox" value="1" data-name="Rain">
Rain x1
</div>


<div class="item">
<input type="checkbox" value="1.4" data-name="Sandstrom">
Sandstrom x1,4
</div>


<div class="item">
<input type="checkbox" value="1.5" data-name="Blizzard">
Blizzard x1,5
</div>


<div class="item">
<input type="checkbox" value="1.5" data-name="Acid Rain (Poison)">
Acid Rain (Poison) x1,5
</div>


<div class="item">
<input type="checkbox" value="1.7" data-name="Lucky">
Lucky x1,7
</div>


<div class="item">
<input type="checkbox" value="1.7" data-name="Thunder">
Thunder x1,7
</div>


<div class="item">
<input type="checkbox" value="1.75" data-name="Bloodmoon">
Bloodmoon x1,75
</div>


<div class="item">
<input type="checkbox" value="1.8" data-name="Molten">
Molten x1,8
</div>


<div class="item">
<input type="checkbox" value="3" data-name="Starfall">
Starfall x3
</div>


<div class="item">
<input type="checkbox" value="3.5" data-name="Aurora">
Aurora x3,5
</div>


</div>


<button onclick="hitung()">Hitung</button>


<div class="hasil" id="hasil">
Isi yang atas dulu memek nabila! . . .
</div>


</div>


<script>

function formatAngka(x){
return new Intl.NumberFormat('id-ID').format(x);
}


function hitung(){

let nilai = Number(document.getElementById("nilai").value);


if(!nilai){
alert("Masukkan nilai Batu");
return;
}


let total = 1;
let daftar = [];


let cek = document.querySelectorAll(
'input[type="checkbox"]:checked'
);


cek.forEach(function(item){

total *= Number(item.value);

daftar.push(
item.dataset.name+" x"+item.value
);

});


if(cek.length==0){

alert("Pilih Buff terlebih dahulu");
return;

}



let hasil = nilai * total;


document.getElementById("hasil").innerHTML =

"<b>Buff yg dipilih:</b><br>"+
daftar.join("<br>")
+
"<hr>"+
"Total Pengali : x"+total+
"<br><br>"+
"Potensi Luck Batu : <b>"+
formatAngka(hasil)+
"</b>";

}


</script>


</body>
</html>
